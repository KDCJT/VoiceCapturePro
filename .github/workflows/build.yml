# ────────────────────────────────────────────────────────────────────────────
# .github/workflows/build.yml  –  v2 (fixed error propagation + app path)
# ────────────────────────────────────────────────────────────────────────────

name: Build VoiceCapturePro IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME:        VoiceCapturePro
  CONFIGURATION: Release

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15   # Xcode 16 — matches XcodeGen's objectVersion 77 format

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode ──────────────────────────────────────────────────
      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications/ | grep Xcode || true
          # Pick the latest Xcode 16.x on the macos-15 runner
          XCODE=$(ls /Applications/ | grep "^Xcode_16" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
            echo "Selected: $XCODE"
          else
            echo "Xcode 16 not found by name, using default"
          fi
          xcodebuild -version

      # ── 3. Install XcodeGen ───────────────────────────────────────────────
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ── 4. Generate Xcode project ─────────────────────────────────────────
      - name: Generate .xcodeproj from project.yml
        run: |
          xcodegen generate --spec project.yml
          ls -la VoiceCapturePro.xcodeproj/

      # ── 5. Build ──────────────────────────────────────────────────────────
      # We capture the xcodebuild exit code explicitly through the pipe
      # using PIPESTATUS[0] so errors are NOT masked by tee/grep.
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          DERIVED="$GITHUB_WORKSPACE/DerivedData"

          xcodebuild \
            -project VoiceCapturePro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

          # Capture xcodebuild's own exit code (PIPESTATUS[0]) before doing anything else
          BUILD_CODE=${PIPESTATUS[0]}

          echo "──────────────────────────────────────"
          echo "xcodebuild exit code: $BUILD_CODE"

          if [ "$BUILD_CODE" -ne 0 ]; then
            echo ""
            echo "❌ BUILD FAILED. Last 60 lines of log:"
            tail -60 build.log
            exit 1
          fi

          if grep -q "BUILD FAILED" build.log; then
            echo "❌ BUILD FAILED (detected in log)"
            grep "error:" build.log | head -30
            exit 1
          fi

          echo "✅ Build succeeded"

      # ── 6. Find .app and package IPA ─────────────────────────────────────
      - name: Find .app and package IPA
        run: |
          DERIVED="$GITHUB_WORKSPACE/DerivedData"

          echo "=== DerivedData/Build/Products contents ==="
          find "$DERIVED/Build/Products" -maxdepth 3 2>/dev/null || echo "(empty)"

          # Dynamically locate the .app – works even if path varies
          APP_PATH=$(find "$DERIVED/Build/Products" \
            -name "VoiceCapturePro.app" \
            -maxdepth 5 \
            -not -path "*.xctest*" \
            2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ VoiceCapturePro.app not found in DerivedData"
            exit 1
          fi

          echo "✅ Found: $APP_PATH"
          ls -la "$APP_PATH"

          # Package as IPA (Payload/*.app → zip → rename .ipa)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VoiceCapturePro-unsigned.ipa Payload/ -x "*.DS_Store"
          rm -rf Payload

          ls -lh VoiceCapturePro-unsigned.ipa
          echo "✅ IPA packaged successfully"

      # ── 7. Upload artifact ────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCapturePro-unsigned-${{ github.sha }}
          path: VoiceCapturePro-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Build Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**IPA**: \`VoiceCapturePro-unsigned.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 安装方式（TrollStore）" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 Artifact zip → 解压得到 IPA" >> $GITHUB_STEP_SUMMARY
          echo "2. TrollStore → **+** → 选择 IPA → Install" >> $GITHUB_STEP_SUMMARY
          echo "3. 无需注册，永久有效 🎉" >> $GITHUB_STEP_SUMMARY
